# Render.com Deployment Configuration
# Arabia Live TV (arabialivetv.com)
# Deploy this file to automatically configure Render on first push

services:
  - type: web
    name: arabia-live-tv
    env: node
    region: frankfurt  # Closest to Middle East
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
    disk:
      name: altv-database
      mountPath: /opt/render/project/src
      sizeGB: 1
